    <script>
      // Android 桥：把 JavascriptInterface 对象包成与鸿蒙 __lxNative 同名同签名的门面，
      // lx-shim.js / host.js 与鸿蒙端保持逐字相同。
      window.__lxNative = {
        onInited: function (json) { window.LxNativeBridge.onInited(String(json)); },
        onResult: function (id, json) { window.LxNativeBridge.onResult(String(id), String(json)); },
        httpRequest: function (id, json) { window.LxNativeBridge.httpRequest(String(id), String(json)); }
      };
    </script>
