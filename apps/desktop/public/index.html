<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>
    window.addEventListener('error', function (e) { document.title = 'ERR: ' + e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0); });
    window.addEventListener('unhandledrejection', function (e) { document.title = 'REJ: ' + ((e.reason && e.reason.message) || e.reason); });
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LxMine</title>
  <link rel="stylesheet" href="/lxmine/style.css">
</head>
<body>
  <svg class="glass-filter-defs" width="0" height="0" aria-hidden="true" focusable="false"><defs></defs></svg>
  <div id="stage" aria-hidden="true">
    <div id="stage-fallback"></div>
    <iframe id="stage-frame" src="about:blank" title="MineRadio"></iframe>
    <iframe id="folia-stage-frame" src="about:blank" title="Folia"></iframe>
    <iframe id="plain-stage-frame" src="about:blank" title="歌词"></iframe>
  </div>
  <div id="page-custom-bg" aria-hidden="true">
    <div id="page-custom-bg-img"></div>
    <div id="page-custom-bg-scrim"></div>
  </div>
  <div id="page-veil" aria-hidden="true"></div>

  <div id="window-drag" aria-hidden="true"></div>
  <div id="window-controls" aria-label="窗口控制">
    <button id="win-fullscreen" aria-label="全屏"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M14.2 4.1a.85.85 0 0 1 .85-.85h4.85a.85.85 0 0 1 .85.85v4.85a.85.85 0 1 1-1.7 0V6.15l-4.25 4.25a.85.85 0 1 1-1.2-1.2l4.25-4.25h-2.8a.85.85 0 0 1-.85-.85ZM9.8 19.9a.85.85 0 0 1-.85.85H4.1a.85.85 0 0 1-.85-.85v-4.85a.85.85 0 1 1 1.7 0v2.8l4.25-4.25a.85.85 0 1 1 1.2 1.2l-4.25 4.25h2.8a.85.85 0 0 1 .85.85Z"/></g></svg></button>
    <button id="win-minimize" aria-label="最小化"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><rect x="5" y="11.1" width="14" height="1.8" rx=".9" fill="currentColor"/></svg></button>
    <button id="win-maximize" aria-label="最大化"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M6.8 5h10.4A1.8 1.8 0 0 1 19 6.8v10.4a1.8 1.8 0 0 1-1.8 1.8H6.8A1.8 1.8 0 0 1 5 17.2V6.8A1.8 1.8 0 0 1 6.8 5Zm.1 1.75a.15.15 0 0 0-.15.15v10.2c0 .08.07.15.15.15h10.2a.15.15 0 0 0 .15-.15V6.9a.15.15 0 0 0-.15-.15H6.9Z"/></svg></button>
    <button id="win-close" class="win-close" aria-label="关闭"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M6.22 6.22a1.02 1.02 0 0 1 1.44 0L12 10.56l4.34-4.34a1.02 1.02 0 1 1 1.44 1.44L13.44 12l4.34 4.34a1.02 1.02 0 1 1-1.44 1.44L12 13.44l-4.34 4.34a1.02 1.02 0 0 1-1.44-1.44L10.56 12 6.22 7.66a1.02 1.02 0 0 1 0-1.44Z"/></g></svg></button>
  </div>
  <button id="floating-back" class="floating-back glass light off" aria-label="返回">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M14.78 4.97a1.05 1.05 0 0 1 0 1.48L9.23 12l5.55 5.55a1.05 1.05 0 1 1-1.48 1.48l-6.3-6.29a1.05 1.05 0 0 1 0-1.48l6.3-6.29a1.05 1.05 0 0 1 1.48 0Z"/></g></svg>
  </button>
  <button id="search-node" class="search-entry glass light off" type="button" aria-label="搜索">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M10.5 3.1a7.4 7.4 0 1 0 4.6 13.2l4.76 4.77a.9.9 0 0 0 1.28-1.27l-4.77-4.77A7.4 7.4 0 0 0 10.5 3.1Zm-5.6 7.4a5.6 5.6 0 1 1 11.2 0 5.6 5.6 0 0 1-11.2 0Z"/></g></svg>
    <span class="label">歌曲、歌手、歌单</span>
  </button>
  <div id="app">
    <div id="top-progressive-blur" class="pblur-idle" aria-hidden="true">
      <div class="pblur-layer l1"></div>
      <div class="pblur-layer l2"></div>
      <div class="pblur-layer l3"></div>
      <div class="pblur-layer l4"></div>
    </div>
    <header id="app-header">
      <button id="back-btn" class="icon-btn glass light hidden" aria-label="返回">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M14.78 4.97a1.05 1.05 0 0 1 0 1.48L9.23 12l5.55 5.55a1.05 1.05 0 1 1-1.48 1.48l-6.3-6.29a1.05 1.05 0 0 1 0-1.48l6.3-6.29a1.05 1.05 0 0 1 1.48 0Z"/></g></svg>
      </button>
      <div class="header-copy">
        <h1 id="page-title">LxMine</h1>
        <p id="page-subtitle"></p>
      </div>
      <div id="header-actions"></div>
    </header>
    <main id="main" tabindex="-1"><div id="view"></div></main>
  </div>

  <section id="search-overlay" class="overlay hidden" aria-label="搜索">
    <div id="search-top-blur" class="overlay-top-blur pblur-idle" aria-hidden="true">
      <div class="pblur-layer l1"></div>
      <div class="pblur-layer l2"></div>
      <div class="pblur-layer l3"></div>
      <div class="pblur-layer l4"></div>
    </div>
    <div id="search-head">
      <button id="search-back" class="icon-btn glass light" aria-label="返回">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M14.78 4.97a1.05 1.05 0 0 1 0 1.48L9.23 12l5.55 5.55a1.05 1.05 0 1 1-1.48 1.48l-6.3-6.29a1.05 1.05 0 0 1 0-1.48l6.3-6.29a1.05 1.05 0 0 1 1.48 0Z"/></g></svg>
      </button>
      <label id="search-box" class="glass light">
        <svg class="search-glyph" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M10.5 3.1a7.4 7.4 0 1 0 4.6 13.2l4.76 4.77a.9.9 0 0 0 1.28-1.27l-4.77-4.77A7.4 7.4 0 0 0 10.5 3.1Zm-5.6 7.4a5.6 5.6 0 1 1 11.2 0 5.6 5.6 0 0 1-11.2 0Z"/></g></svg>
        <input id="search-input" autocomplete="off" spellcheck="false" placeholder="歌曲、歌手、歌单">
        <button id="search-clear" class="plain-btn hidden" aria-label="清空"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M6.22 6.22a1.02 1.02 0 0 1 1.44 0L12 10.56l4.34-4.34a1.02 1.02 0 1 1 1.44 1.44L13.44 12l4.34 4.34a1.02 1.02 0 1 1-1.44 1.44L12 13.44l-4.34 4.34a1.02 1.02 0 0 1-1.44-1.44L10.56 12 6.22 7.66a1.02 1.02 0 0 1 0-1.44Z"/></g></svg></button>
        <button id="search-submit" class="plain-btn search-submit">搜索</button>
      </label>
    </div>
    <div id="search-chips"></div>
    <div id="search-body"><div id="search-results"></div></div>
  </section>

  <section id="detail-overlay" class="overlay hidden" aria-label="正在播放">
    <header id="detail-head">
      <button id="detail-back" class="icon-btn glass light" aria-label="返回">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M14.78 4.97a1.05 1.05 0 0 1 0 1.48L9.23 12l5.55 5.55a1.05 1.05 0 1 1-1.48 1.48l-6.3-6.29a1.05 1.05 0 0 1 0-1.48l6.3-6.29a1.05 1.05 0 0 1 1.48 0Z"/></g></svg>
      </button>
      <div class="detail-head-spacer"></div>
      <button id="ear-monitor-btn" class="icon-btn glass light" aria-label="耳返">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M12 2.8a3.6 3.6 0 0 0-3.6 3.6v5.2a3.6 3.6 0 0 0 7.2 0V6.4A3.6 3.6 0 0 0 12 2.8Zm-1.9 3.6a1.9 1.9 0 1 1 3.8 0v5.2a1.9 1.9 0 1 1-3.8 0V6.4Z"/><path d="M6.2 10.7a.85.85 0 0 1 .85.85 4.95 4.95 0 1 0 9.9 0 .85.85 0 1 1 1.7 0 6.66 6.66 0 0 1-5.8 6.6v2.15h2.4a.85.85 0 1 1 0 1.7h-6.5a.85.85 0 1 1 0-1.7h2.4v-2.15a6.66 6.66 0 0 1-5.8-6.6.85.85 0 0 1 .85-.85Z"/></g></svg>
      </button>
      <button id="style-btn" class="icon-btn glass light" aria-label="动效">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><path d="M9.6 3.4c.28-.65 1.18-.65 1.46 0l1.46 3.45 3.45 1.46c.65.28.65 1.18 0 1.46l-3.45 1.46-1.46 3.45c-.28.65-1.18.65-1.46 0l-1.46-3.45-3.45-1.46c-.65-.28-.65-1.18 0-1.46l3.45-1.46L9.6 3.4Z" fill="#FFFFFF"/><path d="M16.95 13.1c.2-.46.86-.46 1.06 0l.82 1.94 1.94.82c.46.2.46.86 0 1.06l-1.94.82-.82 1.94c-.2.46-.86.46-1.06 0l-.82-1.94-1.94-.82c-.46-.2-.46-.86 0-1.06l1.94-.82.82-1.94Z" fill="#64D2FF"/></svg>
      </button>
      <button id="immersive-btn" class="icon-btn glass light" aria-label="沉浸模式">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M14.2 4.1a.85.85 0 0 1 .85-.85h4.85a.85.85 0 0 1 .85.85v4.85a.85.85 0 1 1-1.7 0V6.15l-4.25 4.25a.85.85 0 1 1-1.2-1.2l4.25-4.25h-2.8a.85.85 0 0 1-.85-.85ZM9.8 19.9a.85.85 0 0 1-.85.85H4.1a.85.85 0 0 1-.85-.85v-4.85a.85.85 0 1 1 1.7 0v2.8l4.25-4.25a.85.85 0 1 1 1.2 1.2l-4.25 4.25h2.8a.85.85 0 0 1 .85.85Z"/></g></svg>
      </button>
    </header>
    <div id="detail-body">
      <div id="detail-lyrics"></div>
    </div>
    <div id="detail-hint">点击歌词可跳转</div>
  </section>

  <section id="comments-overlay" class="overlay hidden" aria-label="歌曲评论">
    <div id="comments-top-blur" class="overlay-top-blur pblur-idle" aria-hidden="true">
      <div class="pblur-layer l1"></div>
      <div class="pblur-layer l2"></div>
      <div class="pblur-layer l3"></div>
      <div class="pblur-layer l4"></div>
    </div>
    <header id="comments-head">
      <button id="comments-back" class="icon-btn glass light" aria-label="返回">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M14.78 4.97a1.05 1.05 0 0 1 0 1.48L9.23 12l5.55 5.55a1.05 1.05 0 1 1-1.48 1.48l-6.3-6.29a1.05 1.05 0 0 1 0-1.48l6.3-6.29a1.05 1.05 0 0 1 1.48 0Z"/></g></svg>
      </button>
      <div class="header-copy"><h1 id="comments-title">评论</h1><p id="comments-subtitle"></p></div>
    </header>
    <div id="comments-body"></div>
  </section>

  <nav id="nav" class="glass light" aria-label="主导航">
    <button data-tab="home" class="nav-item active">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M10.72 3.28a1.9 1.9 0 0 1 2.56 0l7.15 6.55c.36.33.57.8.57 1.29v7.38A2.5 2.5 0 0 1 18.5 21h-13A2.5 2.5 0 0 1 3 18.5v-7.38c0-.49.21-.96.57-1.29l7.15-6.55ZM12 5.22 5 11.63v6.87c0 .28.22.5.5.5h3.75v-4.25a2.75 2.75 0 1 1 5.5 0V19h3.75a.5.5 0 0 0 .5-.5v-6.87L12 5.22Zm-1.25 9.53a1.25 1.25 0 1 1 2.5 0V19h-2.5v-4.25Z"/></g></svg><span>首页</span>
    </button>
    <button data-tab="library" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M6.5 3A1.5 1.5 0 0 1 8 1.5h8A1.5 1.5 0 0 1 17.5 3a.75.75 0 0 1-.75.75h-9.5A.75.75 0 0 1 6.5 3ZM4.75 5.75A1.25 1.25 0 0 1 6 4.5h12a1.25 1.25 0 0 1 1.25 1.25.75.75 0 0 1-.75.75H5.5a.75.75 0 0 1-.75-.75ZM5.75 8h12.5A2.75 2.75 0 0 1 21 10.75v7.5A2.75 2.75 0 0 1 18.25 21H5.75A2.75 2.75 0 0 1 3 18.25v-7.5A2.75 2.75 0 0 1 5.75 8Zm4.65 3.42a.95.95 0 0 0-1.45.81v4.54a.95.95 0 0 0 1.45.81l3.78-2.27a.95.95 0 0 0 0-1.62l-3.78-2.27Z"/></g></svg><span>曲库</span>
    </button>
    <button data-tab="settings" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M4.2 6.8a.9.9 0 0 1 .9-.9h4.65a2.35 2.35 0 0 1 4.5 0h4.65a.9.9 0 1 1 0 1.8h-4.65a2.35 2.35 0 0 1-4.5 0H5.1a.9.9 0 0 1-.9-.9Zm6.9 0a.9.9 0 1 0 1.8 0 .9.9 0 0 0-1.8 0ZM4.2 12a.9.9 0 0 1 .9-.9h1.15a2.35 2.35 0 0 1 4.5 0h8.15a.9.9 0 1 1 0 1.8h-8.15a2.35 2.35 0 0 1-4.5 0H5.1a.9.9 0 0 1-.9-.9Zm3.4 0a.9.9 0 1 0 1.8 0 .9.9 0 0 0-1.8 0ZM4.2 17.2a.9.9 0 0 1 .9-.9h8.15a2.35 2.35 0 0 1 4.5 0h1.15a.9.9 0 1 1 0 1.8h-1.15a2.35 2.35 0 0 1-4.5 0H5.1a.9.9 0 0 1-.9-.9Zm10.4 0a.9.9 0 1 0 1.8 0 .9.9 0 0 0-1.8 0Z"/></g></svg><span>设置</span>
    </button>
  </nav>

  <div id="dock-stack">
    <div id="timeline" class="hidden">
      <span id="time-now">0:00</span>
      <input id="seek" type="range" min="0" max="1" value="0" step="0.1" aria-label="播放进度">
      <span id="time-total">0:00</span>
    </div>
    <div id="dock" class="glass light">
      <button id="dock-cover" class="dock-cover" aria-label="打开歌曲详情">
        <span id="cover-inner"></span>
        <span id="cover-ring"></span>
      </button>
      <div id="dock-copy">
        <strong id="dock-title">尚未播放</strong>
        <span id="dock-artist">选择歌曲，开始聆听</span>
      </div>
      <div id="dock-controls">
        <button data-action="mode" class="dock-btn" aria-label="播放顺序">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" class="mode-icon"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M16.72 3.22a.9.9 0 0 1 1.28 0l2.45 2.45a.9.9 0 0 1 0 1.28l-2.45 2.45a.9.9 0 1 1-1.28-1.28l.91-.91H8.25A3.25 3.25 0 0 0 5 10.46v1.29a.9.9 0 1 1-1.8 0v-1.29A5.05 5.05 0 0 1 8.25 5.4h9.38l-.91-.9a.9.9 0 0 1 0-1.28Zm3.18 8.13a.9.9 0 0 1 .9.9v1.29a5.05 5.05 0 0 1-5.05 5.06H6.37l.91.9a.9.9 0 1 1-1.28 1.28l-2.45-2.45a.9.9 0 0 1 0-1.28l2.45-2.45a.9.9 0 1 1 1.28 1.28l-.91.91h9.38A3.25 3.25 0 0 0 19 13.54v-1.29a.9.9 0 0 1 .9-.9Z"/></g></svg>
        </button>
        <button data-action="prev" class="dock-btn" aria-label="上一首">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M5.75 5.25A1.25 1.25 0 0 1 7 6.5v11a1.25 1.25 0 1 1-2.5 0v-11a1.25 1.25 0 0 1 1.25-1.25Zm13.05.43v10.12c0 1.08-1.18 1.74-2.11 1.17l-8.22-5.06a1.38 1.38 0 0 1 0-2.34l8.22-5.06c.93-.57 2.11.09 2.11 1.17Z" transform="translate(0 1.25)"/></g></svg>
        </button>
        <button data-action="toggle" id="play-btn" class="dock-btn play-btn" aria-label="播放">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" class="play-icon"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M7.35 4.86C7.35 3.63 8.7 2.88 9.76 3.52l10.02 6.08c1.01.61 1.01 2.09 0 2.7L9.76 18.38c-1.06.64-2.41-.11-2.41-1.34V4.86Z" transform="translate(0 1.05)"/></g></svg>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" class="pause-icon"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M6.75 4.5A2.25 2.25 0 0 1 9 6.75v10.5a2.25 2.25 0 1 1-4.5 0V6.75A2.25 2.25 0 0 1 6.75 4.5Zm10.5 0a2.25 2.25 0 0 1 2.25 2.25v10.5a2.25 2.25 0 1 1-4.5 0V6.75a2.25 2.25 0 0 1 2.25-2.25Z"/></g></svg>
        </button>
        <button data-action="next" class="dock-btn" aria-label="下一首">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M5.2 5.68c0-1.08 1.18-1.74 2.11-1.17l8.22 5.06a1.38 1.38 0 0 1 0 2.34l-8.22 5.06c-.93.57-2.11-.09-2.11-1.17V5.68Zm13.05-.43a1.25 1.25 0 0 1 1.25 1.25v11a1.25 1.25 0 1 1-2.5 0v-11a1.25 1.25 0 0 1 1.25-1.25Z" transform="translate(0 1.25)"/></g></svg>
        </button>
        <button data-action="queue" class="dock-btn" aria-label="播放队列">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M16.25 3.6a.95.95 0 0 1 1.16-.92l3.1.78a.95.95 0 0 1 .72.92v1.65a.95.95 0 0 1-1.18.92l-1.9-.48v8.03a3.25 3.25 0 1 1-1.9-2.96V3.6ZM3.75 6.25a.95.95 0 0 1 .95-.95h7.6a.95.95 0 1 1 0 1.9H4.7a.95.95 0 0 1-.95-.95Zm0 5.25a.95.95 0 0 1 .95-.95h7.6a.95.95 0 1 1 0 1.9H4.7a.95.95 0 0 1-.95-.95Zm0 5.25a.95.95 0 0 1 .95-.95h5.1a.95.95 0 1 1 0 1.9H4.7a.95.95 0 0 1-.95-.95Z"/></g></svg>
        </button>
        <button data-action="more" class="dock-btn" aria-label="更多播放操作">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"><path d="M6.25 12a1.65 1.65 0 1 1-3.3 0 1.65 1.65 0 0 1 3.3 0Zm7.4 0a1.65 1.65 0 1 1-3.3 0 1.65 1.65 0 0 1 3.3 0Zm5.75 1.65a1.65 1.65 0 1 0 0-3.3 1.65 1.65 0 0 0 0 3.3Z"/></g></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="toast" role="status"></div>
  <div id="modal-root"></div>
  <div id="wallpaper-ui" class="hidden">
    <div class="wallpaper-caption">
      <strong id="wallpaper-title">尚未播放</strong>
      <span id="wallpaper-artist"></span>
      <p id="wallpaper-lyric"></p>
    </div>
  </div>
  <div id="splash" class="hide" style="display:none"><iframe id="splash-frame" src="about:blank" title="MineRadio startup"></iframe></div>
  <audio id="audio" preload="metadata"></audio>
  <audio id="audio-b" preload="metadata"></audio>

<script src="/lxmine/material.js"></script>
