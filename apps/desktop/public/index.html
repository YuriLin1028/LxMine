<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>
    window.addEventListener('error', function (e) { document.title = 'ERR: ' + e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0); });
    window.addEventListener('unhandledrejection', function (e) { document.title = 'REJ: ' + ((e.reason && e.reason.message) || e.reason); });
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LxMine</title>
  <link rel="stylesheet" href="/lxmine/style.css">
</head>
<body>
  <svg class="glass-filter-defs" width="0" height="0" aria-hidden="true" focusable="false"><defs></defs></svg>
  <div id="stage" aria-hidden="true">
    <div id="stage-fallback"></div>
    <iframe id="stage-frame" src="/mine-stage/harmony-stage.html" title="MineRadio"></iframe>
  </div>
  <div id="page-veil" aria-hidden="true"></div>

  <div id="window-drag" aria-hidden="true"></div>
  <div id="window-controls" aria-label="窗口控制">
    <button id="win-fullscreen" aria-label="全屏"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>
    <button id="win-minimize" aria-label="最小化"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button id="win-maximize" aria-label="最大化"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg></button>
    <button id="win-close" class="win-close" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <button id="floating-back" class="floating-back glass light off" aria-label="返回">
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button id="search-node" class="search-entry glass light off" type="button" aria-label="搜索">
    <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
    <span class="label">歌曲、歌手、歌单</span>
  </button>
  <div id="app">
    <header id="app-header">
      <button id="back-btn" class="icon-btn glass light hidden" aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="header-copy">
        <h1 id="page-title">LxMine</h1>
        <p id="page-subtitle"></p>
      </div>
      <div id="header-actions"></div>
    </header>
    <main id="main" tabindex="-1"><div id="view"></div></main>
  </div>

  <section id="search-overlay" class="overlay hidden" aria-label="搜索">
    <div id="search-head">
      <button id="search-back" class="icon-btn glass light" aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <label id="search-box" class="glass light">
        <svg class="search-glyph" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
        <input id="search-input" autocomplete="off" spellcheck="false" placeholder="歌曲、歌手、歌单">
        <button id="search-clear" class="plain-btn hidden" aria-label="清空">×</button>
        <button id="search-submit" class="plain-btn search-submit">搜索</button>
      </label>
    </div>
    <div id="search-chips"></div>
    <div id="search-body"><div id="search-results"></div></div>
  </section>

  <section id="detail-overlay" class="overlay hidden" aria-label="正在播放">
    <header id="detail-head">
      <button id="detail-back" class="icon-btn glass light" aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="detail-head-spacer"></div>
      <button id="quality-btn" class="icon-btn glass sq-btn light" aria-label="音质">SQ</button>
      <button id="comments-btn" class="icon-btn glass light" aria-label="查看评论">
        <svg viewBox="0 0 24 24"><path d="M20 11.6c0 4.15-3.58 7.4-8 7.4a9 9 0 0 1-3.1-.53L5 20l1.1-3.48A7.1 7.1 0 0 1 4 11.6C4 7.45 7.58 4.2 12 4.2s8 3.25 8 7.4Z"/><circle cx="8.6" cy="11.6" r=".9"/><circle cx="12" cy="11.6" r=".9"/><circle cx="15.4" cy="11.6" r=".9"/></svg>
      </button>
      <button id="style-btn" class="icon-btn glass light" aria-label="动效">
        <svg viewBox="0 0 24 24" class="fill"><path d="M12 3.2c.62 4.6 3.28 7.26 7.8 7.8-4.52.54-7.18 3.2-7.8 7.8-.62-4.6-3.28-7.26-7.8-7.8 4.52-.54 7.18-3.2 7.8-7.8Z"/><path d="M19 2.6c.16 1.18.84 1.86 2 2-.16 1.18-.84 1.86-2 2-.16-1.18-.84-1.86-2-2 .16-1.18.84-1.86 2-2Z"/></svg>
      </button>
      <button id="immersive-btn" class="icon-btn glass light" aria-label="沉浸模式">
        <svg viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>
      </button>
    </header>
    <div id="detail-body">
      <div id="detail-lyrics"></div>
    </div>
    <div id="detail-hint">点击歌词可跳转</div>
  </section>

  <section id="comments-overlay" class="overlay hidden" aria-label="歌曲评论">
    <header id="comments-head">
      <button id="comments-back" class="icon-btn glass light" aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="header-copy"><h1 id="comments-title">评论</h1><p id="comments-subtitle"></p></div>
    </header>
    <div id="comments-body"></div>
  </section>

  <nav id="nav" class="glass light" aria-label="主导航">
    <button data-tab="home" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg><span>首页</span>
    </button>
    <button data-tab="library" class="nav-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>歌单库</span>
    </button>
    <button data-tab="settings" class="nav-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 8.9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3v-4h.08A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 8.96 4.6 1.7 1.7 0 0 0 10 3.04V3h4v.08A1.7 1.7 0 0 0 15.03 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 8.96 1.7 1.7 0 0 0 20.96 10H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"/></svg><span>设置</span>
    </button>
  </nav>

  <div id="dock-stack">
    <div id="timeline" class="hidden">
      <span id="time-now">0:00</span>
      <input id="seek" type="range" min="0" max="1" value="0" step="0.1" aria-label="播放进度">
      <span id="time-total">0:00</span>
    </div>
    <div id="dock" class="glass light">
      <button id="dock-cover" class="dock-cover" aria-label="打开歌曲详情">
        <span id="cover-inner"></span>
        <span id="cover-ring"></span>
      </button>
      <div id="dock-copy">
        <strong id="dock-title">尚未播放</strong>
        <span id="dock-artist">选择歌曲，开始聆听</span>
      </div>
      <div id="dock-controls">
        <button data-action="desktop-lyrics" class="dock-btn desktop-lyrics-btn" aria-label="桌面歌词" aria-pressed="false" title="桌面歌词；右键锁定或解锁">词</button>
        <button data-action="volume" id="volume-btn" class="dock-btn volume-btn" aria-label="音量" title="音量">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path class="volume-wave" d="M16 9.2a4 4 0 0 1 0 5.6"/><path class="volume-wave" d="M18.6 6.6a7.6 7.6 0 0 1 0 10.8"/><path class="volume-muted" d="M4 4l16 16"/></svg>
        </button>
        <button data-action="like" class="dock-btn" aria-label="喜欢">
          <svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-9.4A4.1 4.1 0 0 1 12 7.8a4.1 4.1 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20Z"/></svg>
        </button>
        <button data-action="prev" class="dock-btn" aria-label="上一首">
          <svg viewBox="0 0 24 24" class="fill"><path d="M6 5h2v14H6zM19 5v14l-9-7z"/></svg>
        </button>
        <button data-action="toggle" id="play-btn" class="dock-btn play-btn" aria-label="播放">
          <svg viewBox="0 0 24 24" class="fill play-icon"><path d="M8 5v14l11-7z"/></svg>
          <svg viewBox="0 0 24 24" class="fill pause-icon"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>
        <button data-action="next" class="dock-btn" aria-label="下一首">
          <svg viewBox="0 0 24 24" class="fill"><path d="M16 5h2v14h-2zM5 5v14l9-7z"/></svg>
        </button>
        <button data-action="mode" class="dock-btn" aria-label="播放顺序">
          <svg viewBox="0 0 24 24" class="mode-icon"><path d="M17 3l3 3-3 3"/><path d="M4 7h16"/><path d="M7 21l-3-3 3-3"/><path d="M20 17H4"/></svg>
        </button>
        <button data-action="download" class="dock-btn" aria-label="下载">
          <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M4 20h16"/></svg>
        </button>
        <button data-action="queue" class="dock-btn" aria-label="播放队列">
          <svg viewBox="0 0 24 24"><path d="M4 6h12M4 12h12M4 18h8"/><path d="M19 14v6"/><circle cx="17" cy="20" r="2"/></svg>
        </button>
        <button data-action="more" class="dock-btn mobile-only" aria-label="更多播放操作">···</button>
      </div>
    </div>
  </div>

  <div id="toast" role="status"></div>
  <div id="modal-root"></div>
  <div id="wallpaper-ui" class="hidden">
    <div class="wallpaper-caption">
      <strong id="wallpaper-title">尚未播放</strong>
      <span id="wallpaper-artist"></span>
      <p id="wallpaper-lyric"></p>
    </div>
  </div>
  <div id="splash"><iframe id="splash-frame" src="/mine-stage/startup.html" title="MineRadio startup"></iframe></div>
  <audio id="audio" preload="metadata"></audio>

<script src="/lxmine/material.js"></script>
<script src="/lxmine/pagination.js"></script>
<script src="/lxmine/popup-motion.js"></script>
  <script src="/lxmine/app.js"></script>
</body>
</html>
