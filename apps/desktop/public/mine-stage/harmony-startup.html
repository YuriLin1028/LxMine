<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LxMine</title>
<style>
  :root {
    --bg: #05070B;
    --ice: #64D2FF;
    --sapphire: #3B82F6;
    --iris: #A5B4FC;
    --ink: #F4F7FB;
    --muted: rgba(214, 228, 246, 0.54);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: var(--bg);
    overflow: hidden;
    font-family: "HarmonyOS Sans SC", "HarmonyOS Sans", "PingFang SC", "SF Pro Display", "Microsoft YaHei UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #splash {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    contain: strict;
    opacity: 1;
    transform: translate3d(0, 0, 0) scale3d(1, 1, 1);
    will-change: opacity, transform;
    transition: opacity 320ms cubic-bezier(0.22, 1, 0.36, 1), transform 360ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  #splash.ready { cursor: pointer; }
  #splash.exiting {
    pointer-events: none;
    opacity: 0;
    transform: translate3d(0, 0, 0) scale3d(1.028, 1.028, 1);
  }
  #splash.hide { display: none; pointer-events: none; }
  #splash-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    transform: translate3d(0, 0, 0);
  }
  .splash-content {
    position: relative;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    pointer-events: none;
    transform: translate3d(0, 8px, 0) scale3d(0.965, 0.965, 1);
    opacity: 0;
    will-change: transform, opacity;
    animation: content-enter 760ms 110ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  #splash.exiting .splash-content {
    animation: none;
    opacity: 0;
    transform: translate3d(0, -8px, 0) scale3d(1.02, 1.02, 1);
    transition: opacity 240ms cubic-bezier(0.22, 1, 0.36, 1), transform 300ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .prism-emblem {
    width: clamp(58px, 8.6vw, 76px);
    height: clamp(58px, 8.6vw, 76px);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translate3d(0, 0, 0) scale3d(0.84, 0.84, 1);
    opacity: 0;
    will-change: transform, opacity;
    animation: emblem-pop 820ms 60ms cubic-bezier(0.18, 1.15, 0.32, 1) forwards;
  }
  .prism-emblem svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }
  .wordmark-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    letter-spacing: -0.045em;
    line-height: 1;
    font-size: clamp(44px, 7.6vw, 88px);
    font-weight: 700;
  }
  .word-lx {
    color: var(--ink);
    opacity: 0;
    transform: translate3d(-10px, 0, 0);
    will-change: transform, opacity;
    animation: word-slide 680ms 160ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .word-mine {
    background: linear-gradient(108deg, #FFFFFF 8%, #7DD3FC 46%, #60A5FA 74%, #A5B4FC 98%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    opacity: 0;
    transform: translate3d(10px, 0, 0);
    will-change: transform, opacity;
    animation: word-slide 720ms 210ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .acoustic-rule {
    width: min(280px, 46vw);
    height: 1.5px;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(100, 210, 255, 0), rgba(100, 210, 255, 0.78) 32%, rgba(255, 255, 255, 0.94) 50%, rgba(165, 180, 252, 0.78) 68%, rgba(165, 180, 252, 0));
    transform: scale3d(0.08, 1, 1);
    opacity: 0;
    will-change: transform, opacity;
    animation: rule-expand 780ms 250ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .splash-sub {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0;
    transform: translate3d(0, 6px, 0);
    will-change: transform, opacity;
    animation: sub-rise 680ms 340ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .splash-enter {
    position: fixed;
    left: 50%;
    bottom: max(36px, env(safe-area-inset-bottom, 24px));
    z-index: 6;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    color: rgba(214, 232, 255, 0.56);
    opacity: 0;
    transform: translate3d(-50%, 8px, 0);
    will-change: transform, opacity;
    transition: opacity 360ms cubic-bezier(0.22, 1, 0.36, 1), transform 360ms cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
  }
  #splash.ready .splash-enter {
    opacity: 1;
    transform: translate3d(-50%, 0, 0);
  }
  #splash.exiting .splash-enter {
    opacity: 0;
    transform: translate3d(-50%, -4px, 0);
  }
  @keyframes content-enter {
    to { opacity: 1; transform: translate3d(0, 0, 0) scale3d(1, 1, 1); }
  }
  @keyframes emblem-pop {
    to { opacity: 1; transform: translate3d(0, 0, 0) scale3d(1, 1, 1); }
  }
  @keyframes word-slide {
    to { opacity: 1; transform: translate3d(0, 0, 0); }
  }
  @keyframes rule-expand {
    0% { opacity: 0; transform: scale3d(0.08, 1, 1); }
    45% { opacity: 0.95; }
    100% { opacity: 0.72; transform: scale3d(1, 1, 1); }
  }
  @keyframes sub-rise {
    to { opacity: 1; transform: translate3d(0, 0, 0); }
  }
</style>
</head>
<body>
  <div id="splash" aria-label="LxMine 启动画面">
    <canvas id="splash-canvas"></canvas>
    <div class="splash-content">
      <div class="prism-emblem" aria-hidden="true">
        <svg viewBox="0 0 96 96" fill="none">
          <defs>
            <linearGradient id="g-shell" x1="12" y1="8" x2="84" y2="88" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#1A2942" stop-opacity="0.92"/>
              <stop offset="0.52" stop-color="#0D1526" stop-opacity="0.95"/>
              <stop offset="1" stop-color="#090D18" stop-opacity="0.98"/>
            </linearGradient>
            <linearGradient id="g-rim" x1="10" y1="10" x2="86" y2="86" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#BAE6FD" stop-opacity="0.85"/>
              <stop offset="0.5" stop-color="#64D2FF" stop-opacity="0.32"/>
              <stop offset="1" stop-color="#818CF8" stop-opacity="0.62"/>
            </linearGradient>
            <linearGradient id="g-wave" x1="22" y1="24" x2="74" y2="72" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#FFFFFF"/>
              <stop offset="0.45" stop-color="#64D2FF"/>
              <stop offset="1" stop-color="#818CF8"/>
            </linearGradient>
          </defs>
          <rect x="8" y="8" width="80" height="80" rx="23" fill="url(#g-shell)" stroke="url(#g-rim)" stroke-width="1.5"/>
          <path d="M27 54V42M37 62V34M48 68V28M59 60V36M69 53V43" stroke="url(#g-wave)" stroke-width="5.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="wordmark-row" id="splash-wordmark" aria-label="LxMine">
        <span class="word-lx">Lx</span><span class="word-mine">Mine</span>
      </div>
      <div class="acoustic-rule"></div>
      <div class="splash-sub">Pure Spatial Audio</div>
    </div>
    <div class="splash-enter" aria-hidden="true">轻触跳过</div>
  </div>

<script>
(function () {
  'use strict';

  var splashEl = document.getElementById('splash');
  var canvas = document.getElementById('splash-canvas');
  var animating = true;
  var exiting = false;
  var readyToEnter = false;
  var startedAt = performance.now();
  var audioCtx = null;
  var soundPlayed = false;
  var readyTimer = 0;
  var autoDismissTimer = 0;
  var gl = null;
  var program = null;
  var vbo = null;
  var uRes = null;
  var uTime = null;
  var ctx2d = null;
  var cssW = 1;
  var cssH = 1;
  var dpr = 1;

  function notifyHostDone() {
    try {
      if (window.__lxStartup && typeof window.__lxStartup.done === 'function') {
        window.__lxStartup.done();
      }
    } catch (_) {}
  }

  function stopChime() {
    if (!audioCtx) return;
    try { if (audioCtx.close) audioCtx.close(); } catch (_) {}
    audioCtx = null;
  }

  function playPrismChime() {
    if (soundPlayed) return;
    try {
      var Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return;
      var ctx = audioCtx || new Ctor();
      audioCtx = ctx;
      if (ctx.state === 'suspended' && ctx.resume) {
        ctx.resume().then(function () {
          if (!soundPlayed) playPrismChime();
        }).catch(function () {});
        if (ctx.state === 'suspended') return;
      }
      soundPlayed = true;
      var t0 = ctx.currentTime + 0.03;
      var master = ctx.createGain();
      master.gain.setValueAtTime(0.0001, t0);
      master.gain.exponentialRampToValueAtTime(0.042, t0 + 0.14);
      master.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.45);
      master.connect(ctx.destination);

      // Crystalline spatial harmonic bell: Cmaj9 -> G6add9
      var notes = [
        [523.25, 0.00, 1.55, 0.24],
        [659.25, 0.06, 1.50, 0.20],
        [783.99, 0.12, 1.55, 0.18],
        [1174.66, 0.19, 1.65, 0.14],
        [1567.98, 0.42, 1.75, 0.10]
      ];
      for (var i = 0; i < notes.length; i++) {
        var freq = notes[i][0];
        var delay = notes[i][1];
        var dur = notes[i][2];
        var amp = notes[i][3];
        var osc = ctx.createOscillator();
        var overtone = ctx.createOscillator();
        var g = ctx.createGain();
        var og = ctx.createGain();
        osc.type = 'sine';
        overtone.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t0 + delay);
        overtone.frequency.setValueAtTime(freq * 2, t0 + delay);
        g.gain.setValueAtTime(0.0001, t0 + delay);
        g.gain.linearRampToValueAtTime(amp, t0 + delay + 0.022);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + delay + dur);
        og.gain.setValueAtTime(0.0001, t0 + delay);
        og.gain.linearRampToValueAtTime(amp * 0.18, t0 + delay + 0.015);
        og.gain.exponentialRampToValueAtTime(0.0001, t0 + delay + dur * 0.55);
        osc.connect(g); g.connect(master);
        overtone.connect(og); og.connect(master);
        osc.start(t0 + delay); overtone.start(t0 + delay);
        osc.stop(t0 + delay + dur + 0.04); overtone.stop(t0 + delay + dur * 0.6 + 0.04);
      }
    } catch (_) {}
  }

  function initWebGL() {
    if (!canvas) return false;
    var attrs = {
      alpha: false,
      antialias: false,
      depth: false,
      stencil: false,
      preserveDrawingBuffer: false,
      desynchronized: true,
      powerPreference: 'high-performance'
    };
    try {
      gl = canvas.getContext('webgl2', attrs) || canvas.getContext('webgl', attrs) || canvas.getContext('experimental-webgl', attrs);
    } catch (_) {
      gl = null;
    }
    if (!gl) return false;

    var vsSource = [
      'attribute vec2 aPos;',
      'varying vec2 vUv;',
      'void main(){',
      '  vUv = aPos * 0.5 + 0.5;',
      '  gl_Position = vec4(aPos, 0.0, 1.0);',
      '}'
    ].join('\n');

    // Single-pass analytical Glacial Prism shader:
    // Zero nested loops, zero branching, < 1ms GPU execution at 120Hz.
    var fsSource = [
      'precision highp float;',
      'varying vec2 vUv;',
      'uniform vec2 uRes;',
      'uniform float uTime;',
      '',
      'float sat(float x){ return clamp(x, 0.0, 1.0); }',
      'float smooth01(float x){ x = sat(x); return x * x * (3.0 - 2.0 * x); }',
      '',
      'void main(){',
      '  vec2 p = vUv * 2.0 - 1.0;',
      '  float aspect = uRes.x / max(uRes.y, 1.0);',
      '  p.x *= aspect;',
      '  float t = uTime;',
      '  float intro = smooth01(t / 0.52);',
      '  float bloom = smooth01((t - 0.08) / 0.95);',
      '  float pulse = exp(-pow((t - 1.35) / 0.72, 2.0));',
      '',
      '  // Deep obsidian-sapphire base field',
      '  vec3 base = vec3(0.0196, 0.0275, 0.0431);',
      '  float r2 = dot(p, p);',
      '  float r = sqrt(r2 + 1e-5);',
      '',
      '  // Rotating liquid-glass caustic ring (Glacial Cyan -> Sapphire -> Iris)',
      '  float ang = atan(p.y, p.x);',
      '  float ringRadius = 0.44 + 0.08 * bloom + 0.016 * sin(ang * 3.0 - t * 2.3) + 0.009 * cos(ang * 5.0 + t * 1.7);',
      '  float ringDist = abs(r - ringRadius);',
      '  float ringCore = 0.0095 / (ringDist + 0.016);',
      '  float ringHalo = exp(-ringDist * 5.2) * (0.42 + 0.28 * pulse);',
      '',
      '  // Secondary harmonic shockwave expanding smoothly at 120fps',
      '  float waveR = fract(t * 0.36) * 1.35 + 0.18;',
      '  float waveFade = (1.0 - smooth01((waveR - 0.35) / 1.15)) * bloom;',
      '  float shock = exp(-abs(r - waveR) * 14.0) * waveFade * 0.38;',
      '',
      '  // Spatial acoustic ribbons across the horizon',
      '  float envX = exp(-p.x * p.x * 0.52);',
      '  float y1 = p.y - envX * (0.085 * sin(p.x * 3.2 - t * 3.4) + 0.032 * sin(p.x * 6.8 + t * 2.2));',
      '  float y2 = p.y - envX * (0.072 * sin(p.x * 2.7 + t * 2.9 + 1.8) + 0.026 * cos(p.x * 5.4 - t * 2.6));',
      '  float y3 = p.y + envX * (0.064 * cos(p.x * 3.9 - t * 2.5 + 0.7));',
      '  float rib1 = (0.0055 / (abs(y1) + 0.014)) * envX;',
      '  float rib2 = (0.0048 / (abs(y2) + 0.016)) * envX;',
      '  float rib3 = (0.0042 / (abs(y3) + 0.018)) * envX;',
      '',
      '  // Glacial Prism palette (Strictly zero gold/yellow)',
      '  vec3 cIce = vec3(0.392, 0.824, 1.000);      // #64D2FF',
      '  vec3 cSapphire = vec3(0.231, 0.510, 0.965); // #3B82F6',
      '  vec3 cIris = vec3(0.545, 0.361, 0.965);     // #8B5CF6',
      '  vec3 cMint = vec3(0.369, 0.918, 0.831);     // #5EEAD4',
      '',
      '  float angularMix = 0.5 + 0.5 * sin(ang * 2.0 - t * 1.4);',
      '  vec3 ringTint = mix(cIce, mix(cSapphire, cIris, 0.5 + 0.5 * cos(ang + t)), angularMix);',
      '',
      '  // Ambient aurora nebula behind the wordmark',
      '  vec2 nUv = p * vec2(0.75, 1.15);',
      '  float nebulaA = exp(-dot(nUv - vec2(-0.28 * cos(t * 0.7), 0.12 * sin(t * 0.9)), nUv - vec2(-0.28 * cos(t * 0.7), 0.12 * sin(t * 0.9))) * 2.6);',
      '  float nebulaB = exp(-dot(nUv - vec2(0.30 * sin(t * 0.8), -0.14 * cos(t * 0.6)), nUv - vec2(0.30 * sin(t * 0.8), -0.14 * cos(t * 0.6))) * 2.8);',
      '',
      '  vec3 col = base;',
      '  col += cSapphire * nebulaA * 0.16 * bloom;',
      '  col += cIris * nebulaB * 0.14 * bloom;',
      '  col += ringTint * (ringCore * 0.34 + ringHalo * 0.42) * intro;',
      '  col += mix(cIce, cMint, 0.32) * shock;',
      '  col += (cIce * rib1 * 0.38 + cSapphire * rib2 * 0.34 + cIris * rib3 * 0.30) * (0.45 + 0.55 * bloom) * intro;',
      '',
      '  // Specular center caustic highlight',
      '  float centerGlow = exp(-r2 * 4.4) * (0.10 + 0.16 * pulse) * intro;',
      '  col += mix(cIce, vec3(1.0), 0.45) * centerGlow;',
      '',
      '  // Clean filmic tonemap & smooth vignette',
      '  col = vec3(1.0) - exp(-col * 1.12);',
      '  float vig = smooth01(1.68 - r * 0.62);',
      '  col = mix(base * 0.75, col, 0.35 + 0.65 * vig);',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n');

    function compile(type, src) {
      var s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        gl.deleteShader(s);
        return null;
      }
      return s;
    }

    var vs = compile(gl.VERTEX_SHADER, vsSource);
    var fs = compile(gl.FRAGMENT_SHADER, fsSource);
    if (!vs || !fs) return false;

    var prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      gl.deleteProgram(prog);
      return false;
    }

    program = prog;
    vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    var aPos = gl.getAttribLocation(prog, 'aPos');
    uRes = gl.getUniformLocation(prog, 'uRes');
    uTime = gl.getUniformLocation(prog, 'uTime');
    gl.useProgram(prog);
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.BLEND);
    return true;
  }

  function resize() {
    if (!canvas) return;
    dpr = Math.min(1.5, Math.max(1, window.devicePixelRatio || 1));
    cssW = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 1);
    cssH = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 1);
    // Cap pixel budget to 1.85M pixels so ultra-high-res tablets hold locked 120fps
    var rawPixels = cssW * dpr * cssH * dpr;
    if (rawPixels > 1850000) {
      dpr *= Math.sqrt(1850000 / rawPixels);
    }
    canvas.width = Math.max(1, Math.round(cssW * dpr));
    canvas.height = Math.max(1, Math.round(cssH * dpr));
    if (gl) {
      gl.viewport(0, 0, canvas.width, canvas.height);
    } else if (ctx2d) {
      ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }

  function draw2DFallback(t) {
    ctx2d.fillStyle = '#05070B';
    ctx2d.fillRect(0, 0, cssW, cssH);
    var cx = cssW * 0.5;
    var cy = cssH * 0.5;
    var radius = Math.min(cssW, cssH) * (0.28 + 0.05 * Math.sin(t * 1.6));
    var g = ctx2d.createRadialGradient(cx, cy, radius * 0.1, cx, cy, radius * 1.6);
    g.addColorStop(0, 'rgba(100, 210, 255, 0.22)');
    g.addColorStop(0.5, 'rgba(59, 130, 246, 0.12)');
    g.addColorStop(1, 'rgba(5, 7, 11, 0)');
    ctx2d.fillStyle = g;
    ctx2d.fillRect(0, 0, cssW, cssH);
  }

  function frame(now) {
    if (!animating) return;
    requestAnimationFrame(frame);
    var elapsed = Math.max(0, (now - startedAt) * 0.001);
    if (gl && program) {
      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.uniform1f(uTime, elapsed);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    } else if (ctx2d) {
      draw2DFallback(elapsed);
    }
  }

  function markSplashReadyToEnter() {
    if (!splashEl || exiting) return;
    readyToEnter = true;
    splashEl.classList.add('ready');
    splashEl.setAttribute('role', 'button');
    splashEl.setAttribute('tabindex', '0');
  }

  function dismissSplash(opts) {
    if (exiting || !splashEl) return;
    exiting = true;
    clearTimeout(readyTimer);
    clearTimeout(autoDismissTimer);
    var instant = !!(opts && opts.instant);
    setTimeout(stopChime, instant ? 0 : 180);
    if (instant) {
      animating = false;
      splashEl.classList.add('hide');
      notifyHostDone();
      return;
    }
    splashEl.classList.remove('ready');
    splashEl.classList.add('exiting');
    setTimeout(function () {
      animating = false;
      splashEl.classList.add('hide');
      notifyHostDone();
    }, 320);
  }

  window.markSplashReadyToEnter = markSplashReadyToEnter;
  window.dismissSplash = dismissSplash;

  if (!initWebGL() && canvas) {
    ctx2d = canvas.getContext('2d', { alpha: false });
  }
  resize();
  window.addEventListener('resize', resize, { passive: true });
  requestAnimationFrame(frame);

  playPrismChime();
  function onInteract() {
    playPrismChime();
    if (readyToEnter) dismissSplash();
  }
  if (splashEl) {
    splashEl.addEventListener('pointerdown', onInteract, { passive: true });
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.code === 'Space' || e.key === 'Escape') {
      e.preventDefault();
      onInteract();
    }
  });

  readyTimer = setTimeout(markSplashReadyToEnter, 420);
  autoDismissTimer = setTimeout(function () {
    markSplashReadyToEnter();
    dismissSplash();
  }, 2750);
})();
</script>
</body>
</html>
