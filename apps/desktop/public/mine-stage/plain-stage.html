<body>

  <div id="viewport"><div id="lyrics"></div></div><div id="empty">选择一首歌</div>
  <script>

        vcNodes.sideVocalNotch.gain.setTargetAtTime(sideNotchDb, now, 0.025);
        vcNodes.sidePreserve.gain.setTargetAtTime(sideGain, now, 0.025);

      function ensurePlainVocalGraph() {

          const rToMid = vcCtx.createGain(); rToMid.gain.value = 0.5;

          const rToSide = vcCtx.createGain(); rToSide.gain.value = -0.5;

          const sideBus = vcCtx.createGain(); sideBus.gain.value = 1.0;

      function syncPlainVocalAudio() {

      const measure = document.createElement('canvas').getContext('2d');

      }
      let clockRate = 1;
      function position() { return clock.positionMs + (clock.playing ? (performance.now() - at) * clockRate : 0); }
      function cancelFollow() { cancelAnimationFrame(scrollFrame); scrollFrame = 0; scrollNode = null; scrollVelocity = 0; scrollAt = 0; }

        }

        const anchor = LxMineLyrics.anchorY(window.visualViewport?.height || innerHeight);
        scrollGoal = Math.max(0, Math.min(viewport.scrollHeight - viewport.clientHeight, viewport.scrollTop + text.top + text.height / 2 - anchor));

      function colorKaraoke() {

      function paintKaraoke(time) {

          if (wpBgImg && document.body.classList.contains('wallpaper-host')) {
            const bgSrc = String(value.bgImage || value.cover || '').trim();
            wpBgImg.style.backgroundImage = bgSrc ? `url("${bgSrc.replace(/"/g, '\\"')}")` : 'none';
            if (value.wallpaperBgOpacity !== undefined && isFinite(Number(value.wallpaperBgOpacity))) {
              document.body.style.setProperty('--wp-bg-opacity', String(Math.max(0, Math.min(1, Number(value.wallpaperBgOpacity)))));
            }
            if (value.wallpaperOverallOpacity !== undefined && isFinite(Number(value.wallpaperOverallOpacity))) {
              document.body.style.setProperty('--wp-overall-opacity', String(Math.max(0.2, Math.min(1, Number(value.wallpaperOverallOpacity)))));
            }
          }
          LxMineAppearance.apply(value.appearance);
          const colors = palette = LxMineAppearance.colors({ primary: '#7dd3fc', secondary: '#a5b4fc', ...(value.lyricColors || {}) });
          palette.primary = colors.primary || '#7dd3fc'; palette.secondary = colors.secondary || palette.primary;
          palette.highlight = colors.highlight || palette.primary;
          document.body.style.setProperty('--primary', colors.primary || '#7dd3fc');
          document.body.style.setProperty('--secondary', colors.secondary || colors.primary || '#a5b4fc');
          document.body.classList.toggle('gradient', String(value.lyricColorMode).includes('gradient'));
          colorKaraoke();
          applyInsets();
          const userScale = Math.max(0.55, Math.min(1.5, Number(value.lyricScale) || 1));
          const lineSpacing = Math.max(0.85, Math.min(1.8, Number(value.lyricLineSpacing) || 1.2));
          maxVisibleLines = Math.max(0, Math.min(10, Math.round(Number(value.lyricMaxLines) || 0)));
          document.body.style.setProperty('--user-lyric-scale', String(userScale));
          document.body.style.setProperty('--lyric-line-spacing', String(lineSpacing));
          const nextKey = JSON.stringify([value.id, value.lines, value.translationLines, userScale, lineSpacing, maxVisibleLines]);
          const nextColorSig = JSON.stringify([value.appearance, value.lyricColorMode, value.lyricColors, value.lyricOffset]);
          const initial = key !== nextKey || !root.children.length || !presentation.visible || !presentation.detail;
          const metaVisualChanged = initial || prevColorSig !== nextColorSig;
          prevColorSig = nextColorSig;
          if (key !== nextKey) {
            cancelFollow();
            key = nextKey;
            trackAt = performance.now();
            stageLines = LxMineLyrics.stageLines(value.lines || [], value.duration);
            hasWordKaraoke = stageLines.some(entry => entry.words.length > 0);
            const rawTrans = (value.translationLines || []).filter(line => line && line.text && !/^[\/\\\-—–_~·•\s]+$/.test(String(line.text).trim()));
            const findTrans = timeMs => {
              let best = null, bestDiff = 651;
              for (const tr of rawTrans) {
                const diff = Math.abs(tr.timeMs - timeMs);
                if (diff < bestDiff) { bestDiff = diff; best = tr.text; if (diff === 0) break; }
              }
              return best;
            };
            root.replaceChildren(...(value.lines || []).map(line => {
              const node = document.createElement('p'); node.className = 'line';
              const main = document.createElement('span'); main.className = 'main'; main.textContent = line.text; node.append(main);
              node._main = main;
              const matchedTrans = line.translation || findTrans(line.timeMs);
              if (matchedTrans) { const auxiliary = document.createElement('span'); auxiliary.className = 'translation'; auxiliary.dataset.rawText = matchedTrans; auxiliary.textContent = matchedTrans; node.append(auxiliary); node._sub = auxiliary; }
              node.onclick = event => {
                if (event.clientY < (data.topInset || 0) || event.clientY > innerHeight - (data.bottomInset || 0)) return;
                manualUntil = 0; resumePending = false;
                window.__lxmineNative?.seek?.(LxMineLyrics.seekTime(line.timeMs)); center(node, false);
              };
              return node;
            }));
            active = -1;
          }
          empty.hidden = (value.lines || []).length > 0; empty.textContent = value.name ? '暂无歌词' : '选择一首歌';
          if (typeof value.audioUrl === 'string' && value.audioUrl !== vcSourceUrl) {
            vcSourceUrl = value.audioUrl;
            if (vcAudio) vcAudio.pause();
          }
          syncPlainVocalAudio();
          if (metaVisualChanged) tick(true, initial);
          if (window.__lxmineNative && typeof window.__lxmineNative.visualReady === 'function') window.__lxmineNative.visualReady();
          if (parent !== window) parent.postMessage({ type: 'lxmine-stage-visual-ready' }, location.origin);
        },
        clock(value) {
          const now = performance.now();
          const curMs = position();
          const inMs = Math.max(0, Number(value && value.positionMs) || 0);
          const nextPlaying = !!(value && value.playing);
          const diff = inMs - curMs;
          let finalMs = inMs;
          if (clock.playing && nextPlaying && Math.abs(diff) <= 650) {
            finalMs = curMs;
            clockRate = Math.max(0.88, Math.min(1.12, 1 + (diff / 1000) * 0.35));
          } else {
            clockRate = 1;
          }
          clock = { positionMs: finalMs, playing: nextPlaying };
          at = now;
          syncPlainVocalAudio();
          tick();
        },
        vocalCancel(cfg) {
          cfg = cfg || {};
          vcState.active = cfg.active === true;
          const g = Number(cfg.vocalGain);
          vcState.vocalGain = Number.isFinite(g) ? Math.max(0, Math.min(1.5, g)) : 1.0;
          applyPlainVocalGains();
          syncPlainVocalAudio();
        },
        setInsets(insets) {
          if (!insets) return;
          if (insets.topInset !== undefined) data.topInset = Number(insets.topInset) || 0;
          if (insets.bottomInset !== undefined) data.bottomInset = Number(insets.bottomInset) || 0;
          applyInsets();
        },
        presentation(value) {
          const visible = value.visible !== false, detail = value.detail === true;
          if (presentation.visible === visible && presentation.detail === detail) return;
          const waking = visible && detail && (!presentation.visible || !presentation.detail);
          presentation.visible = visible; presentation.detail = detail;
          if (waking) { manualUntil = 0; resumePending = false; }
          if (!visible || !detail) { cancelFollow(); gestures.reset(); }
          tick(waking, waking);
          if (waking) requestAnimationFrame(() => tick(true, true));
        },
        diagnostics() {
          const glyph = root.children[active]?.querySelector('.main').getBoundingClientRect();
          return { ready: true, plain: true, lyrics: (data.lines || []).length, lyricIndex: active, playing: clock.playing,
            analyser: false, audioContext: null, webgl: false, anchorY: .5, viewportHeight: innerHeight,
            glyphY: glyph ? glyph.top + glyph.height / 2 : null, positionMs: position(), capturedAt: Date.now(),
            scrolling: !!scrollFrame, scrollVelocity, scrollGoal, scrollTop: viewport.scrollTop, karaokeChars: activeChars.length, karaokeBuilds, layoutHeight, karaokeProgress: shownProgress, karaokeFeather: LxMineLyrics.feather(stageLines.some(line => line.words.length)) };
        }
      };
      if (window.__lxmineNative && typeof window.__lxmineNative.ready === 'function') window.__lxmineNative.ready();
      if (parent !== window) parent.postMessage({ type: 'lxmine-stage-ready' }, location.origin);
      document.addEventListener('visibilitychange', () => { if (document.hidden) { clearTimeout(timer); cancelAnimationFrame(lyricFrame); cancelFollow(); gestures.reset(); } else tick(true, true); });
    })();
  </script>
</body>
