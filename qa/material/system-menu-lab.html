<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../apps/desktop/public/lxmine/style.css">
<style>
html,body{margin:0!important;background:#303030!important;width:376px!important;height:810px!important;overflow:visible!important}
body::after{display:none!important}#background{position:absolute;top:0;left:0;width:376px;pointer-events:none}
#probe{position:absolute!important;max-height:none!important;max-width:none!important;min-width:0!important;padding:0!important;overflow:visible!important;will-change:auto!important;transform:none!important;animation:none!important}
</style></head><body>
<svg class="glass-filter-defs" width="0" height="0"><defs></defs></svg>
<img id="background" src="artifacts/native-menu-20261019/native-off.png">
<div class="glass popover anchored-menu" id="probe" style="left:138px;top:93.142857px;width:152px;height:152px;border-radius:24px"></div>
<script src="../../apps/desktop/public/lxmine/material.js"></script>
<script>
LxGlass.install();
window.setup=async ({bounds,texts,semantics=[],options=[],scene,radius=20})=>{
 window.active={bounds,texts,semantics,scene,radius};const p=document.getElementById('probe'),d=devicePixelRatio;
  const image=document.getElementById('background');image.src='artifacts/native-menu-20261019/native-off-'+(scene.endsWith('-type')?'type':'grid')+'.png';
  try{await image.decode()}catch(_){image.src='artifacts/native-menu-20261019/native-off.png';await image.decode()}
 p.style.left=bounds[0]/d+'px';p.style.top=bounds[1]/d+'px';p.style.width=(bounds[2]-bounds[0])/d+'px';p.style.height=(bounds[3]-bounds[1])/d+'px';p.style.borderRadius=radius+'px';
 p.querySelectorAll('.qa-option').forEach(n=>n.remove());
 const border=getComputedStyle(p);
 for(const option of options){const row=document.createElement('div'),b=option.bounds;row.className='menu-row qa-option'+(option.selected?' checked':'');row.style.cssText=`position:absolute;left:${(b[0]-bounds[0])/d-parseFloat(border.borderLeftWidth)}px;top:${(b[1]-bounds[1])/d-parseFloat(border.borderTopWidth)}px;width:${(b[2]-b[0])/d}px;height:${(b[3]-b[1])/d}px;min-height:0;pointer-events:none`;p.appendChild(row);}
 LxGlass.prepare(p);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
};
const decode=async src=>{const image=new Image();image.src=src;await image.decode();const canvas=document.createElement('canvas');canvas.width=image.width;canvas.height=image.height;const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0);return {data:ctx.getImageData(0,0,canvas.width,canvas.height).data,w:canvas.width,h:canvas.height,image}};
window.measure=async png=>{
 const native=await decode('artifacts/native-menu-20261019/'+active.scene+'-on.png'),pc=await decode('data:image/png;base64,'+png),[left,top,right,bottom]=active.bounds,d=devicePixelRatio,w=right-left,h=bottom-top,r=active.radius*d;
 let repeat=null;try{repeat=await decode('artifacts/native-menu-20261019/'+active.scene+'-repeat.png')}catch(_){}
 let repeatSum=0,repeatCount=0;
 const sums={all:[0,0],rim:[0,0],centre:[0,0],outline:[0,0],outside:[0,0]},stats=[0,0,0,0,0,0];let excluded=0,excludedSemantic=0,semanticSum=0;
 for(let y=Math.max(0,top-16*d);y<Math.min(pc.h,bottom+16*d);y++)for(let x=Math.max(0,left-16*d);x<Math.min(pc.w,right+16*d);x++){
   const qx=Math.abs(x+.5-left-w/2)-(w/2-r),qy=Math.abs(y+.5-top-h/2)-(h/2-r),distance=r-Math.hypot(Math.max(0,qx),Math.max(0,qy))-Math.min(Math.max(qx,qy),0);
   if(distance< -16*d)continue;
   if(distance>=0&&active.texts.some(t=>x>=t[0]-d&&x<t[2]+d&&y>=t[1]-d&&y<t[3]+d)){excluded++;continue;}
   const i=(y*native.w+x)*4,j=(y*pc.w+x)*4;let delta=0;for(let c=0;c<3;c++)delta+=Math.abs(native.data[i+c]-pc.data[j+c])/3;
   if(distance>=0&&active.semantics.some(({bounds:t})=>x>=t[0]&&x<t[2]&&y>=t[1]&&y<t[3])){excludedSemantic++;semanticSum+=delta;continue;}
   if(distance<0){sums.outside[0]+=delta;sums.outside[1]++;continue;}
   sums.all[0]+=delta;sums.all[1]++;
   if(repeat){for(let c=0;c<3;c++){repeatSum+=Math.abs(native.data[i+c]-repeat.data[i+c]);repeatCount++;}}
   if(distance<d){sums.outline[0]+=delta;sums.outline[1]++;continue;}
   const part=distance<10*d?'rim':'centre';sums[part][0]+=delta;sums[part][1]++;
   const a=(native.data[i]+native.data[i+1]+native.data[i+2])/3,b=(pc.data[j]+pc.data[j+1]+pc.data[j+2])/3;stats[0]+=a;stats[1]+=b;stats[2]+=a*a;stats[3]+=b*b;stats[4]+=a*b;stats[5]++;
 }
 const n=stats[5],ma=stats[0]/n,mb=stats[1]/n,va=stats[2]/n-ma*ma,vb=stats[3]/n-mb*mb,cov=stats[4]/n-ma*mb;
 const ssim=(2*ma*mb+6.5025)*(2*cov+58.5225)/((ma*ma+mb*mb+6.5025)*(va+vb+58.5225));
 return {scene:active.scene,radius:active.radius,mae:sums.all[0]/sums.all[1],rimMAE:sums.rim[0]/sums.rim[1],centreMAE:sums.centre[0]/sums.centre[1],outlineMAE:sums.outline[0]/sums.outline[1],outsideMAE:sums.outside[0]/sums.outside[1],ssim,repeatMAD:repeat?repeatSum/repeatCount:null,materialPixels:sums.all[1],excludedTextPixels:excluded,excludedSemanticPixels:excludedSemantic,semanticMAE:excludedSemantic?semanticSum/excludedSemantic:null,semanticOverlays:active.semantics,means:{native:ma,pc:mb}};
};
window.measureBare=async png=>{
 const source=await decode(document.getElementById('background').src),pc=await decode('data:image/png;base64,'+png);let sum=0,count=0;
 for(let y=0;y<Math.min(source.h,pc.h);y+=4)for(let x=0;x<Math.min(source.w,pc.w);x+=4){const a=(y*source.w+x)*4,b=(y*pc.w+x)*4;for(let c=0;c<3;c++){sum+=Math.abs(source.data[a+c]-pc.data[b+c]);count++;}}
 return sum/count;
};
</script></body></html>
